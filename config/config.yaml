# ===================================================================
# 多环境配置文件
# 通过环境变量 ENV=test|pre|prod 切换，默认 test
# 真实环境的账号 / 密码 / 域名请勿提交，建议放 .env 或密钥管理
# ===================================================================

# 测试环境
test:
  env_name: test
  base_url: http://test-api.example.com
  timeout: 10                # 单接口超时（秒）
  retry: 3                   # urllib3 连接级重试次数
  # 登录信息（用于 Token 自动刷新）
  login:
    username: test_user
    password: test_pass_123
    url: /api/v1/auth/login
  # 接口签名密钥（HMAC-SHA256 演示用，生产请从密钥管理获取）
  sign:
    secret: test_sign_secret_change_me
    app_id: app_test_001
  # MySQL 配置（用于数据库断言）
  db:
    host: 127.0.0.1
    port: 3306
    user: test_root
    password: test_db_pass
    database: test_business
    charset: utf8mb4
    pool_size: 5             # 连接池大小
  # Redis 配置（用于缓存断言）
  redis:
    host: 127.0.0.1
    port: 6379
    db: 0
    password: test_redis_pass
    decode_responses: true

# 预发环境
pre:
  env_name: pre
  base_url: https://pre-api.example.com
  timeout: 15
  retry: 2
  login:
    username: pre_user
    password: pre_pass_123
    url: /api/v1/auth/login
  sign:
    secret: pre_sign_secret_change_me
    app_id: app_pre_001
  db:
    host: pre-db.example.com
    port: 3306
    user: pre_root
    password: pre_db_pass
    database: pre_business
    charset: utf8mb4
    pool_size: 5
  redis:
    host: pre-redis.example.com
    port: 6379
    db: 0
    password: pre_redis_pass
    decode_responses: true

# 生产环境（一般只读回归，关闭写操作）
prod:
  env_name: prod
  base_url: https://api.example.com
  timeout: 20
  retry: 1
  login:
    username: readonly_user
    password: prod_pass_123
    url: /api/v1/auth/login
  sign:
    secret: prod_sign_secret_change_me
    app_id: app_prod_001
  db:
    host: prod-db.example.com
    port: 3306
    user: readonly
    password: prod_db_pass
    database: prod_business
    charset: utf8mb4
    pool_size: 3
  redis:
    host: prod-redis.example.com
    port: 6379
    db: 0
    password: prod_redis_pass
    decode_responses: true

# ===== 全局通知配置（所有环境共享）=====
notify:
  # 钉钉机器人 webhook（自定义机器人安全设置：加签）
  dingtalk:
    webhook: https://oapi.dingtalk.com/robot/send?access_token=YOUR_DINGTALK_ACCESS_TOKEN
    secret: YOUR_DINGTALK_SECRET
    at_mobiles: []            # @ 指定手机号
    is_at_all: false          # 是否 @ 全员
  # 邮件通知
  email:
    smtp_host: smtp.example.com
    smtp_port: 465
    use_ssl: true
    sender: autoapi@example.com
    sender_password: YOUR_EMAIL_AUTH_CODE
    receivers:
      - qa-team@example.com
