# ===================================================================
# 登录接口用例数据
# - ${username} / ${password} 由 config.yaml 当前环境的 login 段注入
# - marks: 用例标记，对应 pytest.ini 注册的 marker
# - assert: 统一响应断言（status_code / code / msg / jsonpath）
# - extract: 提取字段（正向用例提取 token 注入会话）
# ===================================================================

# 1. 正向登录：账号密码正确
- case_name: 正向登录-账号密码正确
  marks: [smoke, p0]
  request:
    method: POST
    url: /api/v1/auth/login
    json:
      username: ${username}
      password: ${password}
  assert:
    status_code: 200
    code: 0
    msg: success
    jsonpath:
      $.data.token: not_null
      $.data.user_id: not_null
  extract:
    token: $.data.token
    user_id: $.data.user_id

# 2. 密码错误
- case_name: 密码错误-返回密码错误提示
  marks: [p1, regression]
  request:
    method: POST
    url: /api/v1/auth/login
    json:
      username: ${username}
      password: wrong_password_999
  assert:
    status_code: 200
    code: 4001
    msg: re:.*密码.*           # msg 支持正则匹配

# 3. 用户名为空
- case_name: 用户名为空-参数校验失败
  marks: [p1, regression]
  request:
    method: POST
    url: /api/v1/auth/login
    json:
      username: ""
      password: ${password}
  assert:
    status_code: 200
    code: 4000
    msg: re:.*用户名.*           # 提示用户名不能为空

# 4. 密码为空
- case_name: 密码为空-参数校验失败
  marks: [p2, regression]
  request:
    method: POST
    url: /api/v1/auth/login
    json:
      username: ${username}
      password: ""
  assert:
    status_code: 200
    code: 4000
    msg: re:.*密码.*

# 5. 账号锁定（连续错误后触发）
- case_name: 账号锁定-返回账号锁定提示
  marks: [p1, regression]
  request:
    method: POST
    url: /api/v1/auth/login
    json:
      username: locked_user
      password: ${password}
  assert:
    status_code: 200
    code: 4003
    msg: re:.*锁定.*

# 6. 不存在的用户
- case_name: 用户不存在-返回账号不存在
  marks: [p2, regression]
  request:
    method: POST
    url: /api/v1/auth/login
    json:
      username: not_exist_user_001
      password: any_password
  assert:
    status_code: 200
    code: 4002
    msg: re:.*不存在.*
