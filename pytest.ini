[pytest]
# ===== pytest 与 allure 全局配置 =====
minversion = 7.0

# 默认用例收集目录
testpaths = testcase

# 全局执行参数：
#   -v -s              ：详细输出 + 不捕获打印
#   --reruns/--delay   ：失败重试 2 次，间隔 1 秒（pytest-rerunfailures）
#   --alluredir        ：allure 结果输出目录
#   --clean-alluredir  ：每次执行前清空历史结果，避免脏数据
#   -p no:randomly     ：关闭随机顺序（如安装了 pytest-randomly）
addopts = -v -s --reruns 2 --reruns-delay 1 --alluredir=./reports/allure-results --clean-alluredir

# ===== 用例标记（marker）注册，避免 warning =====
markers =
    smoke: 冒烟测试用例（核心主流程，发布前必跑）
    regression: 回归测试用例（全量回归）
    p0: 核心主流程用例（最高优先级）
    p1: 重要功能用例（高优先级）
    p2: 边界 / 异常用例（中优先级）
    db_check: 涉及数据库断言的用例
    redis_check: 涉及 Redis 断言的用例

# ===== 实时日志输出（log_cli）=====
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)-5s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ===== 文件日志 =====
log_file = ./logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)-5s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ===== 收集过滤 =====
python_files = test_*.py
python_classes = Test*
python_functions = test_*
